name: Deploy design preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Stamp preview revision
        run: node -e "require('fs').writeFileSync('public/preview-version.json', JSON.stringify({revision:process.env.GITHUB_SHA}))"
      - name: Build preview
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out browser checks
        uses: actions/checkout@v4
      - name: Set up Node.js for deployment verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed revision, carousel and product browsing in browser
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node tests/carousel.mjs
          node tests/products.mjs
          node tests/details.mjs
